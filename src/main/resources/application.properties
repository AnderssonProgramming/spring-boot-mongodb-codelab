# The MongoDB Atlas connection URI is read from the MONGODB_URI environment variable.
# The username/password must never be hardcoded in this file.
# Expected value example:
# mongodb+srv://ander:<password>@cluster0.yts4paf.mongodb.net/codelab_db?appName=Cluster0
spring.data.mongodb.uri=${MONGODB_URI}

spring.application.name=spring-boot-mongodb-codelab
server.port=${PORT:8080}

# Useful logging to verify the connection with the cluster on startup
logging.level.org.mongodb.driver=INFO
logging.level.org.springframework.data.mongodb=INFO
